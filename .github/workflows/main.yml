name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

# Vercel's Git integration builds and deploys main on its own. This workflow
# is the gate that runs before production is trusted: the PR checks, the
# pooler smoke test and Playwright against cogni-dev. Migrations run inside
# the Vercel production build only (package.json#build guards on
# VERCEL_ENV=production), not as a workflow job and never on Preview builds.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm depcruise
      - run: pnpm audit --audit-level=high

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      CRON_SECRET: ${{ secrets.DEV_CRON_SECRET }}
      # Not a secret: the bucket migration 0004 provisions on cogni-dev. The
      # server env schema requires it, so without it serverEnv() throws on
      # the first DB call and every authenticated e2e test times out.
      SUPABASE_STORAGE_BUCKET: page-assets
      # Same reason: required by the server env schema since phase 2 (0006).
      SUPABASE_PDF_BUCKET: page-pdfs
      # Fake AI provider: CI needs no provider keys nor Upstash.
      AI_PROVIDER_MODE: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
