<!DOCTYPE html><html><head><meta charset="utf-8">
<style>/* Cogni Design System — Tokens */
/* v2.0 — Based on Aceagency/Techerly reference */
/* Warm, clean, professional educational platform */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* ========== COLOR PRIMITIVES ========== */

  /* Primary — Violet (from reference) */
  --color-primary-50:  #F5F3FF;
  --color-primary-100: #EDE9FE;
  --color-primary-200: #DDD6FE;
  --color-primary-300: #C4B5FD;
  --color-primary-400: #A78BFA;
  --color-primary-500: #8B5CF6;
  --color-primary-600: #7C3AED;
  --color-primary-700: #6D28D9;
  --color-primary-800: #5B21B6;
  --color-primary-900: #4C1D95;

  /* Neutral — Warm Gray (from reference: warm beige-gray tones) */
  --color-neutral-0:   #FFFFFF;
  --color-neutral-50:  #FAFAF8;
  --color-neutral-100: #F5F3EF;
  --color-neutral-150: #EDEAE4;
  --color-neutral-200: #E5E2DC;
  --color-neutral-300: #D4D0C8;
  --color-neutral-400: #A8A29E;
  --color-neutral-500: #78716C;
  --color-neutral-600: #57534E;
  --color-neutral-700: #44403C;
  --color-neutral-800: #292524;
  --color-neutral-900: #1C1917;
  --color-neutral-950: #0C0A09;

  /* Pastel Event Colors (from reference) */
  --color-pastel-pink:    #FDDEE6;
  --color-pastel-pink-fg: #9B2C4A;
  --color-pastel-green:   #D5F5E3;
  --color-pastel-green-fg:#1B7A43;
  --color-pastel-yellow:  #FEF3C7;
  --color-pastel-yellow-fg:#92400E;
  --color-pastel-purple:  #E9E0FD;
  --color-pastel-purple-fg:#5B21B6;
  --color-pastel-orange:  #FFE4D6;
  --color-pastel-orange-fg:#C2410C;
  --color-pastel-blue:    #DBEAFE;
  --color-pastel-blue-fg: #1E40AF;
  --color-pastel-mint:    #D1FAE5;
  --color-pastel-mint-fg: #065F46;

  /* Semantic */
  --color-success-50:  #ECFDF5;
  --color-success-100: #D1FAE5;
  --color-success-500: #10B981;
  --color-success-600: #059669;
  --color-success-700: #047857;

  --color-warning-50:  #FFFBEB;
  --color-warning-100: #FEF3C7;
  --color-warning-500: #F59E0B;
  --color-warning-600: #D97706;

  --color-error-50:    #FEF2F2;
  --color-error-100:   #FEE2E2;
  --color-error-500:   #EF4444;
  --color-error-600:   #DC2626;

  --color-info-50:     #EFF6FF;
  --color-info-100:    #DBEAFE;
  --color-info-500:    #3B82F6;
  --color-info-600:    #2563EB;

  /* ========== SEMANTIC TOKENS (Light) ========== */
  --bg-app:       var(--color-neutral-100);  /* warm gray outer bg */
  --bg-page:      var(--color-neutral-0);    /* white content area */
  --bg-card:      var(--color-neutral-0);
  --bg-sidebar:   var(--color-neutral-0);
  --bg-hover:     var(--color-neutral-50);
  --bg-active:    var(--color-primary-50);
  --bg-muted:     var(--color-neutral-100);
  --bg-overlay:   rgba(28, 25, 23, 0.4);
  --bg-topbar:    var(--color-neutral-0);

  --fg-default:   var(--color-neutral-900);
  --fg-secondary: var(--color-neutral-500);
  --fg-muted:     var(--color-neutral-400);
  --fg-on-primary:var(--color-neutral-0);
  --fg-link:      var(--color-primary-600);
  --fg-active:    var(--color-primary-600);

  --border-default:  var(--color-neutral-200);
  --border-hover:    var(--color-neutral-300);
  --border-focus:    var(--color-primary-500);
  --border-error:    var(--color-error-500);
  --border-subtle:   var(--color-neutral-150);

  /* Buttons */
  --btn-primary-bg:    var(--color-neutral-900);
  --btn-primary-hover: var(--color-neutral-800);
  --btn-primary-fg:    var(--color-neutral-0);

  --btn-secondary-bg:    var(--color-neutral-0);
  --btn-secondary-border:var(--color-neutral-200);
  --btn-secondary-hover: var(--color-neutral-50);
  --btn-secondary-fg:    var(--color-neutral-700);

  --btn-ghost-hover: var(--color-neutral-100);
  --btn-ghost-fg:    var(--color-neutral-600);

  --btn-accent-bg:    var(--color-primary-600);
  --btn-accent-hover: var(--color-primary-700);
  --btn-accent-fg:    var(--color-neutral-0);

  --btn-danger-bg:    var(--color-error-600);
  --btn-danger-hover: var(--color-error-500);
  --btn-danger-fg:    var(--color-neutral-0);

  /* Sidebar */
  --sidebar-section-label: var(--color-neutral-400);
  --sidebar-item-hover:    var(--color-neutral-50);
  --sidebar-item-active-bg:var(--color-primary-50);
  --sidebar-item-active-fg:var(--color-primary-700);
  --sidebar-badge-bg:      var(--color-primary-600);
  --sidebar-badge-fg:      var(--color-neutral-0);

  /* ========== TYPOGRAPHY ========== */
  --font-sans:  'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', monospace;

  --text-xs:   0.75rem;   /* 12px */
  --text-sm:   0.875rem;  /* 14px */
  --text-base: 1rem;      /* 16px */
  --text-lg:   1.125rem;  /* 18px */
  --text-xl:   1.25rem;   /* 20px */
  --text-2xl:  1.5rem;    /* 24px */
  --text-3xl:  1.875rem;  /* 30px */
  --text-4xl:  2.25rem;   /* 36px */

  --leading-tight:  1.2;
  --leading-snug:   1.375;
  --leading-normal: 1.5;

  --weight-regular:  400;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;

  /* Semantic type */
  --h1-size:   var(--text-3xl);
  --h1-weight: var(--weight-bold);
  --h2-size:   var(--text-2xl);
  --h2-weight: var(--weight-semibold);
  --h3-size:   var(--text-xl);
  --h3-weight: var(--weight-semibold);
  --body-size:   var(--text-sm);
  --body-weight: var(--weight-regular);
  --label-size:   var(--text-sm);
  --label-weight: var(--weight-medium);
  --caption-size:   var(--text-xs);
  --section-label-size: 11px;
  --section-label-weight: var(--weight-medium);

  /* ========== SPACING ========== */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ========== BORDERS & RADIUS ========== */
  --radius-sm:    6px;
  --radius-md:    8px;
  --radius-lg:    12px;
  --radius-xl:    16px;
  --radius-2xl:   20px;
  --radius-3xl:   24px;
  --radius-pill:  9999px;
  --radius-content: 20px;  /* main content area radius */

  /* ========== SHADOWS ========== */
  --shadow-xs:  0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm:  0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:  0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg:  0 8px 24px rgba(0,0,0,0.1);
  --shadow-xl:  0 16px 48px rgba(0,0,0,0.12);

  /* Focus ring */
  --ring-width: 2px;
  --ring-offset: 2px;
  --ring-color: var(--color-primary-400);

  /* ========== TRANSITIONS ========== */
  --duration-fast:    150ms;
  --duration-default: 200ms;
  --duration-slow:    300ms;
  --duration-flip:    500ms;
  --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out:     cubic-bezier(0, 0, 0.2, 1);

  /* ========== LAYOUT ========== */
  --sidebar-width:     240px;
  --sidebar-collapsed: 64px;
  --topbar-height:     52px;
  --study-panel-width: 320px;
  --content-padding:   32px;
}

/* ========== DARK MODE ========== */
[data-theme="dark"] {
  --bg-app:     #1A1B2E;
  --bg-page:    #232438;
  --bg-card:    #2A2B42;
  --bg-sidebar: #1A1B2E;
  --bg-hover:   #2F3050;
  --bg-active:  rgba(139, 92, 246, 0.15);
  --bg-muted:   #2A2B42;
  --bg-topbar:  #232438;

  --fg-default:   #F0EEEB;
  --fg-secondary: #9896A3;
  --fg-muted:     #6B6980;
  --fg-link:      var(--color-primary-400);
  --fg-active:    var(--color-primary-400);

  --border-default: #3A3B52;
  --border-hover:   #4A4B62;
  --border-subtle:  #2F3050;

  --btn-primary-bg:    var(--color-neutral-0);
  --btn-primary-hover: var(--color-neutral-100);
  --btn-primary-fg:    var(--color-neutral-900);

  --btn-secondary-bg:    #2A2B42;
  --btn-secondary-border:#3A3B52;
  --btn-secondary-hover: #3A3B52;
  --btn-secondary-fg:    #D4D0C8;

  --btn-ghost-hover: #2F3050;
  --btn-ghost-fg:    #9896A3;

  --sidebar-section-label: #6B6980;
  --sidebar-item-hover:    #2F3050;
  --sidebar-item-active-bg:rgba(139, 92, 246, 0.15);
  --sidebar-item-active-fg:var(--color-primary-400);
}

/* ========== BASE RESETS ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  font-size: var(--body-size);
  font-weight: var(--body-weight);
  line-height: var(--leading-normal);
  color: var(--fg-default);
  background: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1 { font-size: var(--h1-size); font-weight: var(--h1-weight); line-height: var(--leading-tight); }
h2 { font-size: var(--h2-size); font-weight: var(--h2-weight); line-height: var(--leading-tight); }
h3 { font-size: var(--h3-size); font-weight: var(--h3-weight); line-height: var(--leading-snug); }

a { color: var(--fg-link); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: var(--font-mono); }
</style>
<style>
body { background: white; padding: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
.group { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 10px; font-weight: 600; color: var(--color-neutral-500); text-transform: uppercase; letter-spacing: 0.05em; }
.row { display: flex; gap: 3px; }
.s { width: 52px; height: 44px; border-radius: 6px; display: flex; align-items: flex-end; padding: 4px; }
.s span { font-size: 8px; font-weight: 600; }
</style></head><body>
<div class="group"><div class="label">Primary — Violet</div><div class="row">
<div class="s" style="background:#F5F3FF"><span style="color:#6D28D9">50</span></div>
<div class="s" style="background:#EDE9FE"><span style="color:#6D28D9">100</span></div>
<div class="s" style="background:#DDD6FE"><span style="color:#6D28D9">200</span></div>
<div class="s" style="background:#C4B5FD"><span style="color:#4C1D95">300</span></div>
<div class="s" style="background:#A78BFA"><span style="color:white">400</span></div>
<div class="s" style="background:#8B5CF6"><span style="color:white">500</span></div>
<div class="s" style="background:#7C3AED"><span style="color:white">600</span></div>
<div class="s" style="background:#6D28D9"><span style="color:white">700</span></div>
<div class="s" style="background:#5B21B6"><span style="color:white">800</span></div>
<div class="s" style="background:#4C1D95"><span style="color:white">900</span></div>
</div></div>
</body></html>
